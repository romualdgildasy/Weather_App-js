<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Météo • Weather App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      transition: background 0.8s ease;
    }

    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loader {
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .history-chip {
      transition: all 0.2s ease;
    }
    .history-chip:hover {
      background: #0ea5e9;
      color: white;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Carte principale -->
    <div class="glass rounded-3xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="px-6 pt-6 pb-4 flex items-center justify-between">
        <h1 class="text-xl font-semibold text-slate-800 tracking-tight">Météo</h1>
        <button id="geoBtn" class="w-10 h-10 rounded-full bg-sky-100 text-sky-600 hover:bg-sky-200 transition flex items-center justify-center" title="Ma position">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
      </div>

      <!-- Recherche -->
      <div class="px-6 pb-4">
        <div class="relative">
          <input 
            id="cityInput"
            type="text" 
            placeholder="Rechercher une ville..." 
            class="w-full bg-white/80 border border-slate-200 rounded-2xl py-3.5 px-5 pr-12 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-transparent transition"
            autocomplete="off"
          />
          <button id="searchBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-sky-500 hover:text-sky-600">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
          </button>
        </div>

        <!-- Historique -->
        <div id="history" class="flex flex-wrap gap-2 mt-3"></div>
      </div>

      <!-- Loader -->
      <div id="loader" class="hidden py-16 flex justify-center">
        <div class="loader"></div>
      </div>

      <!-- Message d'erreur -->
      <div id="error" class="hidden px-6 pb-6">
        <div class="bg-red-50 text-red-600 rounded-2xl p-4 text-center text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="errorText">Ville introuvable</span>
        </div>
      </div>

      <!-- Contenu météo (caché au début) -->
      <div id="weatherContent" class="hidden">

        <!-- Météo actuelle -->
        <div class="px-6 pb-6 text-center fade-in">
          <img id="weatherIcon" src="images/day-1.svg" alt="icône météo" class="w-28 h-28 mx-auto mb-2 drop-shadow-lg" />
          <p id="temperature" class="text-6xl font-light text-slate-800 tracking-tighter">--°</p>
          <p id="description" class="text-lg text-slate-500 capitalize mt-1">--</p>
          <p id="cityName" class="text-slate-700 font-medium mt-1">--</p>
        </div>

        <!-- Détails -->
        <div class="grid grid-cols-2 gap-3 px-6 pb-6">
          <div class="bg-white/60 rounded-2xl p-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-500 flex items-center justify-center">
              <i class="fa-solid fa-temperature-half"></i>
            </div>
            <div>
              <p class="text-xs text-slate-500">Ressenti</p>
              <p id="feelsLike" class="font-semibold text-slate-800">--°</p>
            </div>
          </div>

          <div class="bg-white/60 rounded-2xl p-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-500 flex items-center justify-center">
              <i class="fa-solid fa-droplet"></i>
            </div>
            <div>
              <p class="text-xs text-slate-500">Humidité</p>
              <p id="humidity" class="font-semibold text-slate-800">--%</p>
            </div>
          </div>

          <div class="bg-white/60 rounded-2xl p-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-cyan-100 text-cyan-500 flex items-center justify-center">
              <i class="fa-solid fa-wind"></i>
            </div>
            <div>
              <p class="text-xs text-slate-500">Vent</p>
              <p id="wind" class="font-semibold text-slate-800">-- km/h</p>
            </div>
          </div>

          <div class="bg-white/60 rounded-2xl p-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-500 flex items-center justify-center">
              <i class="fa-solid fa-sun"></i>
            </div>
            <div>
              <p class="text-xs text-slate-500">Soleil</p>
              <p id="sun" class="font-semibold text-slate-800 text-sm">--</p>
            </div>
          </div>
        </div>

        <!-- Prévisions 5 jours -->
        <div class="px-6 pb-8">
          <h2 class="text-sm font-medium text-slate-500 mb-3 uppercase tracking-wider">Prévisions 5 jours</h2>
          <div id="forecast" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
            <!-- Généré en JS -->
          </div>
        </div>
      </div>
    </div>

    <p class="text-center text-white/70 text-xs mt-6">
      Données • OpenWeatherMap
    </p>
    <p class="text-center text-white/70 text-xs mt-6">
  © <span id="year"></span> Lerusse
    </p>
  </div>

  <script src="script.js"></script>
  <script>
  // Année automatique
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
